<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070d0f" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Backgammon with 3D graphics — roll the dice, move the checkers, play the computer." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d1b1a'/><circle cx='16' cy='16' r='8.5' fill='%23efe4cc'/><circle cx='16' cy='16' r='4' fill='%23a4402f'/></svg>" />
<title>Backgammon — 3D</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="stage">
  <canvas id="board" aria-label="Backgammon board"></canvas>

  <header class="top-bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 21V9l9-6 9 6v12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 21v-7h8v7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </span>
      <span class="brand-name">Backgammon</span>
    </div>

    <div class="stake-chip" id="stakeChip" title="Every move banks points — clear the stake before the computer wins the game">
      <div class="stake-row">
        <span class="stake-name" id="stakeName">Stake I</span>
        <span class="stake-val"><b id="stakeScore">0</b><i>/</i><span id="stakeTarget">500</span></span>
      </div>
      <div class="stake-house hidden" id="stakeHouse"></div>
      <div class="stake-bar"><i id="stakeFill"></i></div>
    </div>

    <div class="turn-chip" id="turnChip">
      <span class="dot white" id="turnDot"></span>
      <span class="turn-lines">
        <span class="turn-text" id="turnText">Your turn</span>
        <span class="turn-sub" id="turnSub">Roll the dice</span>
      </span>
    </div>

    <nav class="top-actions">
      <button class="btn" id="modeBtn" title="Toggle opponent">vs Computer</button>
      <button class="btn" id="undoBtn" title="Undo last move">Undo</button>
      <button class="btn icon" id="soundBtn" aria-pressed="true" title="Sound on/off">&#9834;</button>
      <button class="btn" id="newBtn" title="New game — you draw a side (N)">New game</button>
    </nav>
  </header>

  <aside class="pip-card">
    <div class="pip-row">
      <span class="pip-dot white"></span>
      <span class="pip-name">White</span>
      <span class="you-tag">you</span>
      <span class="pip-val" id="pipW">167</span>
    </div>
    <div class="pip-row">
      <span class="pip-dot black"></span>
      <span class="pip-name">Black</span>
      <span class="you-tag">you</span>
      <span class="pip-val" id="pipB">167</span>
    </div>
    <div class="pip-hint" id="hint"></div>
  </aside>

  <div class="roll-panel">
    <div class="dice-row" id="diceRow"></div>
    <button class="btn reroll-btn hidden" id="rerollBtn" title="Loaded dice: reroll before you move">Reroll</button>
    <button class="roll-btn" id="rollBtn"><span id="rollLabel">Roll dice</span></button>
  </div>

  <div class="floaters" id="floaters" aria-hidden="true"></div>

  <div class="toast" id="toast" role="status"></div>

  <div class="shop hidden" id="shop" role="dialog" aria-modal="true">
    <div class="shop-card">
      <div class="shop-head">
        <span class="shop-mark" aria-hidden="true">&#9670;</span>
        <h2>Stake cleared</h2>
        <p id="shopSub">Spend your coins — the next stake is bigger.</p>
      </div>
      <div class="shop-wallet"><b id="shopCoins">0</b><span>coins</span></div>
      <div class="shop-items" id="shopItems"></div>
      <button class="btn primary" id="shopDone">Continue</button>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="card">
      <div class="card-mark">&#9861;</div>
      <h2 id="overlayTitle">White wins</h2>
      <p id="overlaySub">A clean single game.</p>
      <button class="btn primary" id="overlayBtn">New game</button>
    </div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
